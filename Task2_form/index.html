<!DOCTYPE html>
<html>

    <head>
        <title>registeration Form</title>
            <meta charset="UTF-8">
            <meta name="viewport" content="width = devive-width , initial=1.0">
            <!-- <meta name="description" content="Form">
            <meta name="keywords" content="cv , front , back , net">
            <meta name="author" content="company"> -->
    </head>

<body>

    <form method="post" action="submitted.html">
        <fieldset>
            <legend>form</legend>
            <div>
                <label for="name">name:</label>
                <input type="text" pattern="[a-z A-z]{3,5}" id="name" name="name">
            </div>

            <div>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>
            </div>

            <div>
                <label for="pass">password: </label>
                <input type="password" name="password" id="pass" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{1,}"
                    title="Must contain at least one  number and one uppercase and lowercase letter, and at least 1 special character">
            </div>

            <label for="phone">Phone:</label>
                <input tel="number" name="phone" id="phone" pattern="01[0125][0-9]{8}"
                    title="phone must start with 010 or 012 or 011 or 015 followed by 8 digits">
            </div>

            <div>
                <label for="track">choose your track</label>
                <input type="text" list="track">
                <datalist id="track">
                    <option value="front">frontend</option>
                    <option value="back">backend</option>
                    <option value="net">Network</option>
                </datalist>
            </div>
            <div>
                <label for="CV">uploav your CV: </label>
                <input type="file" accept=".png">
            </div>

            <div>
                <label for="name">address:</label>
                <input type="text" pattern="[a-z A-z]{5,}" id="address" name="address">
            </div>

              <div>
                <label for="points">points</label>
                <input type="range" id="points" name="points" min="300" max="500">
            </div>
            <div>
                <input type="submit" value="register">
                <input type="reset" value="Clear">
            </div>
        </fieldset>
    </form>
</body>

</html>
